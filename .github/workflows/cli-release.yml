name: CLI release

on:
  push:
    tags:
      - 'cli-v*'

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Test installer on Unix
        if: runner.os != 'Windows'
        run: node --test skills/panshi-camp/scripts/install-cli.test.mjs
      - name: Test Windows installer boundaries
        if: runner.os == 'Windows'
        run: node --test --test-name-pattern "Windows layout|Windows path safety|Windows real-junction|embedded entry fails safely|executable has no URL|direct execution|Skill documents" skills/panshi-camp/scripts/install-cli.test.mjs
      - run: node --test e2e/cli-public-install.test.mjs
      - run: npm run build -w @panshi/contracts
      - run: npm run build -w @panshi/camp-client
      - run: node --test tests/cli-docs.test.mjs tests/cli-package.test.mjs tests/cli-release.test.mjs
      - run: npm test -w panshi-camp-cli
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:parity

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:cli-release
      - name: Verify tag and release artifact
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run check:cli-release -- --tag "$RELEASE_TAG"
      - name: Upload immutable CLI release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist-release/panshi-camp-cli-*.tgz dist-release/release-manifest.json --verify-tag --title "Panshi Camp CLI $RELEASE_TAG" --generate-notes
