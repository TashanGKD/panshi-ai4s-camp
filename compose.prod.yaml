x-api-image: &api-image
  image: panshi-ai4s-camp-api:${IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: apps/api/Dockerfile
    target: production

services:
  postgres:
    image: postgres:16.12-alpine3.23
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - database-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  migration:
    <<: *api-image
    command: ["node", "apps/api/dist/src/db/migrate.js"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    restart: "no"

  api:
    <<: *api-image
    environment:
      API_PORT: "3001"
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS}
      FILE_STORAGE_ROOT: /app/var/uploads
      BACKUP_ROOT: /app/var/backups
      APP_VERSION: ${BACKUP_APP_VERSION:?set BACKUP_APP_VERSION}
      VERIFICATION_PROVIDER: disabled
    volumes:
      - uploads-data:/app/var/uploads
      - backups-data:/app/var/backups:ro
    depends_on:
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    restart: unless-stopped

  operations:
    image: postgres:16.12-bookworm
    profiles: ["operations"]
    user: "1000:1000"
    entrypoint: ["/bin/bash"]
    working_dir: /workspace
    environment:
      BACKUP_ROOT: ${BACKUP_ROOT:?set BACKUP_ROOT}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:?set BACKUP_RETENTION_DAYS}
      BACKUP_DATABASE_URL: ${BACKUP_DATABASE_URL:?set BACKUP_DATABASE_URL}
      BACKUP_UPLOAD_DIR: ${BACKUP_UPLOAD_DIR:?set BACKUP_UPLOAD_DIR}
      BACKUP_APP_VERSION: ${BACKUP_APP_VERSION:?set BACKUP_APP_VERSION}
      RESTORE_DATABASE_URL: ${RESTORE_DATABASE_URL:-}
      RESTORE_UPLOAD_DIR: ${RESTORE_UPLOAD_DIR:?set RESTORE_UPLOAD_DIR}
      RESTORE_ACKNOWLEDGE: ${RESTORE_ACKNOWLEDGE:-}
    volumes:
      - uploads-data:/uploads
      - backups-data:/backups
      - ./deploy:/workspace/deploy:ro
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    restart: "no"

  frontend:
    image: panshi-ai4s-camp-frontend:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: production
      args:
        VITE_API_BASE_URL: ""
        VITE_PUBLIC_WEB_BASE_URL: ""
    ports:
      - "${HTTP_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    restart: unless-stopped

volumes:
  database-data:
  uploads-data:
  backups-data:
