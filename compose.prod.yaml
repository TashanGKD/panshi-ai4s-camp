x-api-image: &api-image
  image: panshi-ai4s-camp-api:${IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: apps/api/Dockerfile
    target: production

x-operations: &operations
  image: panshi-ai4s-camp-operations:${IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: deploy/Dockerfile.operations
  user: "${OPERATIONS_UID:?set OPERATIONS_UID}:${OPERATIONS_GID:?set OPERATIONS_GID}"
  entrypoint: ["/bin/bash"]
  working_dir: /workspace
  depends_on:
    postgres:
      condition: service_healthy
    operations-volume-init:
      condition: service_completed_successfully
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=32m
  restart: "no"

x-archive-limits: &archive-limits
  UPLOAD_ARCHIVE_MAX_COMPRESSED_BYTES: ${UPLOAD_ARCHIVE_MAX_COMPRESSED_BYTES:?set UPLOAD_ARCHIVE_MAX_COMPRESSED_BYTES}
  UPLOAD_ARCHIVE_MAX_EXPANDED_BYTES: ${UPLOAD_ARCHIVE_MAX_EXPANDED_BYTES:?set UPLOAD_ARCHIVE_MAX_EXPANDED_BYTES}
  UPLOAD_ARCHIVE_MAX_ENTRIES: ${UPLOAD_ARCHIVE_MAX_ENTRIES:?set UPLOAD_ARCHIVE_MAX_ENTRIES}
  UPLOAD_ARCHIVE_MAX_PATH_DEPTH: ${UPLOAD_ARCHIVE_MAX_PATH_DEPTH:?set UPLOAD_ARCHIVE_MAX_PATH_DEPTH}

services:
  postgres:
    image: postgres:16.12-alpine3.23
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - database-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  migration:
    <<: *api-image
    command: ["node", "apps/api/dist/src/db/migrate.js"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    restart: "no"

  api:
    <<: *api-image
    user: "${OPERATIONS_UID:?set OPERATIONS_UID}:${OPERATIONS_GID:?set OPERATIONS_GID}"
    environment:
      API_PORT: "3001"
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS}
      FILE_STORAGE_ROOT: /data/uploads
      BACKUP_ROOT: /backups
      APP_VERSION: ${BACKUP_APP_VERSION:?set BACKUP_APP_VERSION}
      VERIFICATION_PROVIDER: disabled
    volumes:
      - uploads-data:/data
      - backups-data:/backups:ro
    depends_on:
      migration:
        condition: service_completed_successfully
      operations-volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    restart: unless-stopped

  operations-volume-init:
    image: panshi-ai4s-camp-operations:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/Dockerfile.operations
    user: "0:0"
    entrypoint: ["/bin/bash"]
    command: ["deploy/init-operation-volumes.sh"]
    working_dir: /workspace
    environment:
      OPERATIONS_UID: ${OPERATIONS_UID:?set OPERATIONS_UID}
      OPERATIONS_GID: ${OPERATIONS_GID:?set OPERATIONS_GID}
    volumes:
      - uploads-data:/data
      - backups-data:/backups
      - ./deploy:/workspace/deploy:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    read_only: true
    restart: "no"

  backup:
    <<: *operations
    profiles: ["backup"]
    environment:
      <<: *archive-limits
      BACKUP_ROOT: ${BACKUP_ROOT:?set BACKUP_ROOT}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:?set BACKUP_RETENTION_DAYS}
      BACKUP_PGHOST: ${BACKUP_PGHOST:?set BACKUP_PGHOST}
      BACKUP_PGPORT: ${BACKUP_PGPORT:?set BACKUP_PGPORT}
      BACKUP_PGDATABASE: ${BACKUP_PGDATABASE:?set BACKUP_PGDATABASE}
      BACKUP_PGUSER: ${BACKUP_PGUSER:?set BACKUP_PGUSER}
      BACKUP_PGPASSFILE: /run/secrets/backup.pgpass
      BACKUP_UPLOAD_DIR: /data/uploads
      BACKUP_APP_VERSION: ${BACKUP_APP_VERSION:?set BACKUP_APP_VERSION}
      MAINTENANCE_API_HEALTH_URL: ${MAINTENANCE_API_HEALTH_URL:?set MAINTENANCE_API_HEALTH_URL}
      MAINTENANCE_ACK: ${MAINTENANCE_ACK:-}
    volumes:
      - uploads-data:/data:ro
      - backups-data:/backups
      - ./deploy:/workspace/deploy:ro
      - ${BACKUP_PGPASSFILE_HOST:?set BACKUP_PGPASSFILE_HOST}:/run/secrets/backup.pgpass:ro

  restore:
    <<: *operations
    profiles: ["restore"]
    environment:
      <<: *archive-limits
      BACKUP_ROOT: ${BACKUP_ROOT:?set BACKUP_ROOT}
      RESTORE_PGHOST: ${RESTORE_PGHOST:?set RESTORE_PGHOST}
      RESTORE_PGPORT: ${RESTORE_PGPORT:?set RESTORE_PGPORT}
      RESTORE_PGDATABASE: ${RESTORE_PGDATABASE:?set RESTORE_PGDATABASE}
      RESTORE_PGUSER: ${RESTORE_PGUSER:?set RESTORE_PGUSER}
      RESTORE_PGPASSFILE: /run/secrets/restore.pgpass
      RESTORE_UPLOAD_DIR: /data/uploads
      RESTORE_MIN_FREE_BYTES: ${RESTORE_MIN_FREE_BYTES:?set RESTORE_MIN_FREE_BYTES}
      MAINTENANCE_API_HEALTH_URL: ${MAINTENANCE_API_HEALTH_URL:?set MAINTENANCE_API_HEALTH_URL}
      MAINTENANCE_ACK: ${MAINTENANCE_ACK:-}
    volumes:
      - uploads-data:/data
      - backups-data:/backups
      - ./deploy:/workspace/deploy:ro
      - ${RESTORE_PGPASSFILE_HOST:?set RESTORE_PGPASSFILE_HOST}:/run/secrets/restore.pgpass:ro

  frontend:
    image: panshi-ai4s-camp-frontend:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: production
      args:
        VITE_API_BASE_URL: ""
        VITE_PUBLIC_WEB_BASE_URL: ""
    ports:
      - "${HTTP_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    restart: unless-stopped

volumes:
  database-data:
  uploads-data:
  backups-data:
