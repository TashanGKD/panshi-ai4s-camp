name: panshi-ai4s-camp

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: panshi_ai4s_camp
      POSTGRES_USER: panshi
      POSTGRES_PASSWORD: panshi_local
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - panshi-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panshi -d panshi_ai4s_camp"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  panshi-postgres-data:
